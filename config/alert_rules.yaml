alerts:
  - name: slow_user_responses
    severity: warning
    condition: 'latency_p95_ms > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-k4-l3a-alerts"
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: users_receiving_errors
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-k4-l3a-alerts"
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: weak_answers
    severity: warning
    condition: 'quality_score_avg < 0.75 or retrieval_success_rate_pct < 90'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-k4-l3a-alerts"
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-3
